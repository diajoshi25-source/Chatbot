<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1ea"/>
      <stop offset="1" stop-color="#ffc4d6"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#circle)">
    <!-- background -->
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="170" cy="30" r="46" fill="#cfe4ff"/>

    <!-- hair (back) -->
    <path d="M100 26c-44 0-58 34-56 70c1 22-10 32-6 50q4 12 12 10q2 10 14 8q10 6 20 0h32q10 6 20 0q12 2 14-8q8 2 12-10c4-18-7-28-6-50c2-36-12-70-56-70z" fill="#4a2a20"/>

    <!-- neck -->
    <path d="M88 116h24v26c-6 5-18 5-24 0z" fill="#efc2a8"/>

    <!-- blazer -->
    <path d="M30 210c2-42 26-64 70-68 44 4 68 26 70 68z" fill="#2d3f70"/>
    <!-- shirt -->
    <path d="M84 142l16 40 16-40c-10-4-22-4-32 0z" fill="#fff"/>
    <path d="M84 142l-6 12 14 6zM116 142l6 12-14 6z" fill="#fff"/>
    <!-- lapels -->
    <path d="M78 146l-8 8 26 32-12-38zM122 146l8 8-26 32 12-38z" fill="#22335e"/>

    <!-- face -->
    <ellipse cx="100" cy="88" rx="33" ry="38" fill="#f8d6c1"/>

    <!-- brows -->
    <path d="M79 79q7-5 14-2M107 77q7-3 14 2" stroke="#4a2a20" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- eyes -->
    <ellipse cx="86" cy="90" rx="4.6" ry="5.6" fill="#2a1712"/>
    <ellipse cx="114" cy="90" rx="4.6" ry="5.6" fill="#2a1712"/>
    <circle cx="87.8" cy="88" r="1.7" fill="#fff"/>
    <circle cx="115.8" cy="88" r="1.7" fill="#fff"/>

    <path d="M81.6 86.5l-4-3M118.4 86.5l4-3" stroke="#2a1712" stroke-width="2" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M100 95q-3 7 1.5 9" stroke="#d9a084" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- blush -->
    <ellipse cx="77" cy="104" rx="7" ry="4" fill="#ff8fb1" opacity=".55"/>
    <ellipse cx="123" cy="104" rx="7" ry="4" fill="#ff8fb1" opacity=".55"/>

    <!-- big smile -->
    <path d="M86 109h28q-3 17-14 17t-14-17z" fill="#8c2a41"/>
    <path d="M87 109h26q-1 5-13 5.5T87 109z" fill="#fff"/>
    <ellipse cx="100" cy="121" rx="6" ry="3" fill="#f07a98"/>

    <!-- hair (front, side-swept) -->
    <path d="M66 86c-4-32 14-52 38-52 22 0 36 16 32 50-6-18-18-28-32-30-10 10-24 20-38 32z" fill="#553024"/>
    <path d="M67 80c-10 22-6 48-14 72 14-8 20-30 18-60z" fill="#553024"/>
    <path d="M134 80c8 22 6 46 13 70-13-8-18-30-16-58z" fill="#553024"/>
    <path d="M104 38c-6 8-10 14-18 20" stroke="#6e3f30" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- sparkles -->
    <path d="M160 70l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff"/>
    <path d="M36 50l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#8fbdf0"/>
  </g>
</svg>
